{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h2>Student Details</h2>
        </div>

        <div class="card-body">

            <table class="table table-bordered">

                <tr>
                    <th>Name</th>
                    <td>{{ student[1] }}</td>
                </tr>

                <tr>
                    <th>Roll No</th>
                    <td>{{ student[2] }}</td>
                </tr>

                <tr>
                    <th>Attendance</th>
                    <td>{{ student[5] }}%</td>
                </tr>

                <tr>
                    <th>Branch</th>
                    <td>{{ student[4] }}</td>
                </tr>

                <tr>
                    <th>Marks</th>
                    <td>{{ student[3] }}</td>
                </tr>

            </table>

            <a href="{{ url_for('home') }}" class="btn btn-success">
                Back to Home
            </a>

            <a href="{{ url_for('records') }}" class="btn btn-secondary">
                View Records
            </a>

        </div>
    </div>

</div>

{% endblock %}
