{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center align-items-center py-5">
    <div class="col-12 col-md-5 col-lg-4">
        <div class="card shadow-lg border-0 rounded-lg">
            <div class="card-header text-center py-4">
                <h4 class="text-white" fw-bold><i class="fas fa-users me-2" ></i>Register </h4>
            </div>
            <div class="card-body p-5">
                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">
                            <i class="fas fa-user me-2"></i>Username
                        </label>
                        <input type="text" id="username" name="username" class="form-control form-control-lg" placeholder="Choose a username" required>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label">
                            <i class="fas fa-key me-2"></i>Password
                        </label>
                        <input type="password" id="password" name="password" class="form-control form-control-lg" placeholder="Create a strong password" required>
                        <small class="text-muted">
                            <i class="fas fa-shield-alt me-1"></i>Min 6 characters recommended
                        </small>
                    </div>
                    
                    <button type="submit" class="btn btn-success btn-lg w-100 fw-bold mb-3">
                        <i class="fas fa-check-circle me-2"></i>Create Account
                    </button>
                </form>

                <hr class="my-4">
                
                <p class="text-center mb-0">
                    Already have an account? 
                    <a href="{{ url_for('login') }}" class="fw-bold text-success text-decoration-none">
                        Login here
                    </a>
                </p>
            </div>
        </div>

        
    </div>
</div>
{% endblock %}
