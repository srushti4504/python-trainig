{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2 class="text-center mb-4">Edit Student Record</h2>

    <div class="card p-4 shadow">

        <form method="POST" enctype="multipart/form-data">

            <div class="mb-3">
                <label class="form-label">Student Name</label>
                <input type="text"
                       name="name"
                       class="form-control"
                       value="{{ student['name'] }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Roll Number</label>
                <input type="number"
                       name="roll_no"
                       class="form-control"
                       value="{{ student[2] }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Branch</label>
                <input type="text"
                       name="branch"
                       class="form-control"
                       value="{{ student['branch'] }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Year</label>
                <select name="year" class="form-select" required>
                    <option value="1st Year" {% if student['year'] == '1st Year' %}selected{% endif %}>1st Year</option>
                    <option value="2nd Year" {% if student['year'] == '2nd Year' %}selected{% endif %}>2nd Year</option>
                    <option value="3rd Year" {% if student['year'] == '3rd Year' %}selected{% endif %}>3rd Year</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Attendance (%)</label>
                <input type="number"
                       name="attendance"
                       class="form-control"
                       value="{{ student['attendance'] }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Photo</label>
                <input type="file" name="photo" class="form-control" accept="image/*">
            </div>

            <div class="mb-3">
                <label class="form-label">Marks</label>
                <input type="number"
                       name="marks"
                       class="form-control"
                       value="{{ student['marks'] }}"
                       required>
            </div>

            <button type="submit" class="btn btn-success">
                Update Student
            </button>

            <a href="{{ url_for('records') }}" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
