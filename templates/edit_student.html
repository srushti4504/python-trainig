{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2 class="text-center mb-4">Edit Student Record</h2>

    <div class="card p-4 shadow">

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Student Name</label>
                <input type="text"
                       name="name"
                       class="form-control"
                       value="{{ student[1] }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Roll Number</label>
                <input type="number"
                       name="roll_no"
                       class="form-control"
                       value="{{ student[2] }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Branch</label>
                <input type="text"
                       name="branch"
                       class="form-control"
                       value="{{ student[4] }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Attendance (%)</label>
                <input type="number"
                       name="attendance"
                       class="form-control"
                       value="{{ student[5] }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Marks</label>
                <input type="number"
                       name="marks"
                       class="form-control"
                       value="{{ student[3] }}"
                       required>
            </div>

            <button type="submit" class="btn btn-success">
                Update Student
            </button>

            <a href="{{ url_for('records') }}" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
