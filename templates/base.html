<!DOCTYPE html>
<html>
<head>
    <title>College Smart Portal</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="/">College Smart Portal branding</a>
        
            <div class="navbar-nav">
                <a class=" navbar-brand nav-link" href="/">Home</a>
                <a class=" navbar-brand nav-link" href="/records">Records</a>
                <a class="navbar-brand nav-link" href="/notices">Notices</a>

            </div>
        </div>
    </nav>
    
    <a href="{{ url_for('home') }}" class="btn btn-secondary mt-3">Back to Home</a>
    <a href="{{ url_for('records') }}" class="btn btn-secondary mt-3">View Records</a>
    <a href="{{ url_for('notices') }}" class="btn btn-secondary mt-3">View Notices</a>

    <hr>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center p-3 mt-5">
        © 2026 College Smart Portal | Government Polytechnic Hingoli
    </footer>

</body>
</html>
