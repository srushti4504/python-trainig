{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center align-items-center py-5">
    <div class="col-12 col-md-5 col-lg-4">
        <div class="card shadow-lg border-0 rounded-lg">
            <div class="card-header text-center py-4">
                <h4 class="text-white" fw-bold><i class="fas fa-users me-2"></i>Login </h4>
            </div>
            <div class="card-body p-5">
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">
                            <i class="fas fa-user me-2"></i>Username
                        </label>
                        <input type="text" id="username" name="username" class="form-control form-control-lg" placeholder="Enter your username" required>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label">
                            <i class="fas fa-key me-2"></i>Password
                        </label>
                        <input type="password" id="password" name="password" class="form-control form-control-lg" placeholder="Enter your password" required>
                    </div>
                    
                    <button type="submit" class="btn btn-success btn-lg w-100 fw-bold mb-3">
                        <i class="fas fa-sign-in-alt me-2"></i>Login
                    </button>
                </form>

                <hr class="my-4">
                
                <p class="text-center mb-0">
                    Don't have an account? 
                    <a href="{{ url_for('register') }}" class="fw-bold text-success text-decoration-none">
                        Register here
                    </a>
                </p>
            </div>
        </div>

        
    </div>
</div>

<style>
    body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #f8fbf9 0%, #eef5f2 100%);
        z-index: -1;
    }
</style>
{% endblock %}
